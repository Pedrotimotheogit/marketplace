spring.application.name=marketplace
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/registration}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}

management.endpoint.health.show-details=always
spring.docker.compose.lifecycle-management=start_only
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
